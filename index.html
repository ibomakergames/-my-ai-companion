<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليلى - رفيقتك الافتراضية</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #11111b;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #202033;
  text-align: center;
  border-bottom: 1px solid #444;
}
header h2 { margin: 0; color: #d6a5ff; }
main { padding: 20px; }
.welcome {
  text-align: center;
  margin-top: 65px;
}
.welcome h1 { color: #d6a5ff; }
.welcome p { color: #aaa; }
.chat {
  margin-top: 40px;
  background: #202033;
  padding: 18px;
  border-radius: 15px;
}
input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #303047;
  color: white;
  font-size: 16px;
}
</style>
</head>
<body>
<header>
  <h2>ليلى</h2>
  <small>رفيقتك الافتراضية</small>
</header>
<main>
  <div class="welcome">
    <h1>أهلاً بك</h1>
    <p>أنا ليلى، يسعدني الحديث معك.</p>
  </div>
  <div class="chat">
    <input placeholder="اكتب رسالتك هنا...">
  </div>
</main>
</body>
</html>
