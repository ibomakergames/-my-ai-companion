
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليلى | رفيقتك الخاصة</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101014;
  color: #f5f0f5;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 18px;
  background: #1c1920;
  border-bottom: 1px solid #39313d;
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #a66b91;
  display: grid;
  place-items: center;
  font-size: 22px;
}
h2 { margin: 0 0 5px; color: #e8b4d2; }
.status { color: #aaa; font-size: 12px; }
main {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}
.welcome {
  text-align: center;
  margin: 65px auto 35px;
}
.welcome h1 { color: #e8b4d2; }
.welcome p { color: #aaa; line-height: 1.8; }
.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 16px;
  margin: 12px 0;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.user {
  background: #49344b;
  margin-right: auto;
}
.assistant {
  background: #25232b;
  margin-left: auto;
}
footer {
  padding: 13px;
  background: #1c1920;
  border-top: 1px solid #39313d;
  display: flex;
  gap: 9px;
}
textarea {
  flex: 1;
  resize: none;
  height: 48px;
  border-radius: 13px;
  padding: 13px;
  background: #302b35;
  border: 1px solid #514654;
  color: white;
  font-size: 15px;
  outline: none;
}
button {
  background: #a66b91;
  color: white;
  border: none;
  border-radius: 13px;
  padding: 0 19px;
  font-size: 15px;
}
</style>
</head>
<body>

<header>
  <div class="avatar">ل</div>
  <div>
    <h2>ليلى</h2>
    <div class="status">رفيقتك الخاصة</div>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="avatar" style="margin:auto">ل</div>
    <h1>أهلاً بك</h1>
    <p>
      أنا ليلى، رفيقتك الافتراضية.<br>
      يسعدني أن نتحدث ونتعرف إلى بعضنا أكثر.
    </p>
  </div>
</main>

<footer>
  <textarea id="message" placeholder="اكتب رسالتك إلى ليلى..."></textarea>
  <button onclick="sendMessage()">إرسال</button>
</footer>

<script>
function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const value = input.value.trim();

  if (!value) return;

  document.getElementById("welcome")?.remove();

  const bubble = document.createElement("div");
  bubble.className = "message user";
  bubble.textContent = value;
  chat.appendChild(bubble);

  const reply = document.createElement("div");
  reply.className = "message assistant";
  reply.textContent = "وصلت رسالتك. سنربط ذكائي الاصطناعي في الخطوة القادمة.";
  chat.appendChild(reply);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("message").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
